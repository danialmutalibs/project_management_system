[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_pgsql", "php82Extensions.pgsql", "php82Extensions.zip", "php82Extensions.gd", "php82Extensions.bcmath", "php82Extensions.intl", "php82Extensions.mbstring", "php82Extensions.exif", "php82Extensions.opcache", "php82Extensions.curl", "composer", "nodejs_18", "nodePackages.npm"]

[phases.build]
cmds = ["cp .env.example .env", "composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs", "npm ci", "npm run build"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
