[variables]
NIXPACKS_PHP_VERSION = "8.2"
NIXPACKS_NODE_VERSION = "18"

[phases.build]
cmds = [
    "cp .env.example .env",
    "composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs",
    "npm ci",
    "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
